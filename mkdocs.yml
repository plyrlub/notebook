site_name: 笔记分享库
site_description: 个人学习笔记整理
site_url: https://plyrlub.github.io/notebook/
repo_url: https://github.com/plyrlub/notebook

theme:
  name: material
  language: zh
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - toc.integrate

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - tables

nav:
  - 主页: index.md
  - Java:
    - Java SPI 机制详解: Java/Java SPI 机制详解.md
    - Java volatile 详解: Java/Java volatile 详解.md
    - Java 反射详解: Java/Java 反射详解.md
    - Java GC 详解: Java/Java GC 详解.md
  - Tomcat:
    - Tomcat 学习笔记（总览）: Java/tomcat/00-Tomcat 学习笔记（总览）.md
    - 01 系统架构与原理剖析: Java/tomcat/01-Tomcat 系统架构与原理剖析.md
    - 02 服务器核心配置详解: Java/tomcat/02-Tomcat 服务器核心配置详解.md
    - 03 源码构建: Java/tomcat/03-Tomcat 源码构建.md
    - 04 核心流程剖析: Java/tomcat/04-Tomcat 核心流程剖析.md
    - 05 类加载机制剖析: Java/tomcat/05-Tomcat 类加载机制剖析.md
    - 06 类加载机制详解: Java/tomcat/06-Tomcat 类加载机制详解.md
    - 07 对 HTTPS 的支持: Java/tomcat/07-Tomcat 对 HTTPS 的支持.md
    - 08 性能优化策略: Java/tomcat/08-Tomcat 性能优化策略.md
