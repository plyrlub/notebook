# 部署机上的应用编排
# 配合 .gitlab-ci.yml 的 deploy stage 使用
# 使用方式：
#   export IMAGE_TAG=abc1234 && docker-compose up -d --no-deps app
# 回滚：
#   export IMAGE_TAG=<历史 tag> && docker-compose up -d --no-deps app

version: '3.8'

services:
  app:
    # 镜像 tag 由环境变量 IMAGE_TAG 注入，CI 部署时自动设置
    # 不要写死 tag，否则回滚困难
    image: registry.example.com/myapp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # 配置文件挂载（不同环境用不同 config）
    volumes:
      - ./config/${APP_ENV:-dev}.yml:/app/config.yml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      replicas: 2            # 单机双副本，提升可用性
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - appnet

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  redis-data:
