<line x1="165.0" y1="326" x2="165.0" y2="390" stroke="#4a7ab5" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="270" y1="433.0" x2="325" y2="433.0" stroke="#4a7ab5" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="535" y1="433.0" x2="590" y2="433.0" stroke="#4a7ab5" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="695.0" y1="476" x2="695.0" y2="540" stroke="#4a7ab5" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="590" y1="583.0" x2="270" y2="583.0" stroke="#4a7ab5" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="430.0" y="575.0" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">使用中</text>
