<svg baseProfile="full" height="1020" version="1.1" width="1140" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="g" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="#64748b" /></marker><marker id="a" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb" /></marker><marker id="b" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="#d97706" /></marker><marker id="p" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4"><path d="M0,0 L8,4 L0,8 z" fill="#db2777" /></marker></defs><text fill="#111827" font-family="PingFang SC, Heiti SC" font-size="26" font-weight="bold" text-anchor="middle" x="570.0" y="36">A↔B 循环依赖：三级缓存流转</text><text fill="#94a3b8" font-family="PingFang SC, Heiti SC" font-size="14" font-weight="normal" text-anchor="middle" x="570.0" y="60">图中实线 = 主流程去向，虚线 = 查询命中；灰字 = 底层调用名（仅补充）</text><rect fill="#dbeafe" height="96" rx="14" stroke="#2563eb" stroke-width="2.4" width="300" x="110" y="96" /><text fill="#1f2937" font-family="PingFang SC, Heiti SC" font-size="22" font-weight="bold" text-anchor="middle" x="260.0" y="136">Bean A</text><text fill="#6b7280" font-family="PingFang SC, Heiti SC" font-size="13" text-anchor="middle" x="260.0" y="162">依赖 B</text><rect fill="#fef3c7" height="96" rx="14" stroke="#d97706" stroke-width="2.4" width="300" x="730" y="96" /><text fill="#1f2937" font-family="PingFang SC, Heiti SC" font-size="22" font-weight="bold" text-anchor="middle" x="880.0" y="136">Bean B</text><text fill="#6b7280" font-family="PingFang SC, Heiti SC" font-size="13" text-anchor="middle" x="880.0" y="162">依赖 A</text><rect fill="#f8fafc" height="470" rx="18" stroke="#cbd5e1" stroke-width="2" width="1060" x="40" y="260" /><text fill="#334155" font-family="PingFang SC, Heiti SC" font-size="17" font-weight="bold" text-anchor="middle" x="570.0" y="290">Spring 三级缓存（DefaultSingletonBeanRegistry）</text><text fill="#0f766e" font-family="PingFang SC, Heiti SC" font-size="13" font-weight="normal" text-anchor="middle" x="570.0" y="316">查缓存顺序：① → ② → ③ · 图上从左到右 = 从外层工厂③ → 最终容器①</text><rect fill="#fce7f3" height="170" rx="14" stroke="#db2777" stroke-width="2.4" width="280" x="80" y="340" /><text fill="#1f2937" font-family="PingFang SC, Heiti SC" font-size="22" font-weight="bold" text-anchor="middle" x="220.0" y="390">③</text><text fill="#6b7280" font-family="PingFang SC, Heiti SC" font-size="13" text-anchor="middle" x="220.0" y="416">ObjectFactory 惰性工厂</text><rect fill="#ede9fe" height="170" rx="14" stroke="#7c3aed" stroke-width="2.4" width="280" x="420" y="340" /><text fill="#1f2937" font-family="PingFang SC, Heiti SC" font-size="22" font-weight="bold" text-anchor="middle" x="560.0" y="390">②</text><text fill="#6b7280" font-family="PingFang SC, Heiti SC" font-size="13" text-anchor="middle" x="560.0" y="416">A 的早期引用
（半成品实例）</text><rect fill="#dcfce7" height="170" rx="14" stroke="#15803d" stroke-width="2.4" width="370" x="700" y="340" /><text fill="#1f2937" font-family="PingFang SC, Heiti SC" font-size="22" font-weight="bold" text-anchor="middle" x="885.0" y="390">①</text><text fill="#6b7280" font-family="PingFang SC, Heiti SC" font-size="13" text-anchor="middle" x="885.0" y="416">成品 Bean
（A、B 完整后）</text><text fill="#94a3b8" font-family="PingFang SC, Heiti SC" font-size="11.5" font-weight="normal" text-anchor="middle" x="220.0" y="538">addSingletonFactory</text><text fill="#94a3b8" font-family="PingFang SC, Heiti SC" font-size="11.5" font-weight="normal" text-anchor="middle" x="560.0" y="538">getObject → getEarlyBeanReference</text><text fill="#94a3b8" font-family="PingFang SC, Heiti SC" font-size="11.5" font-weight="normal" text-anchor="middle" x="885.0" y="538">放入（最终容器）</text><polyline fill="none" marker-end="url(#a)" points="260.0,192 260.0,246 220,246 220,340" stroke="#2563eb" stroke-width="3.4" /><circle cx="260.0" cy="216" fill="#2563eb" r="17" stroke="#fff" stroke-width="2" /><text fill="#fff" font-family="PingFang SC, Heiti SC" font-size="18" font-weight="bold" text-anchor="middle" x="260.0" y="222">1</text><text fill="#1d4ed8" font-family="PingFang SC, Heiti SC" font-size="12" font-weight="bold" text-anchor="middle" x="278.0" y="216">① 登记进③</text><polyline fill="none" marker-end="url(#b)" points="880.0,192 880.0,266 220,266 220,340" stroke="#d97706" stroke-width="3.4" /><circle cx="880.0" cy="216" fill="#d97706" r="17" stroke="#fff" stroke-width="2" /><text fill="#fff" font-family="PingFang SC, Heiti SC" font-size="18" font-weight="bold" text-anchor="middle" x="880.0" y="222">2</text><text fill="#b45309" font-family="PingFang SC, Heiti SC" font-size="12" font-weight="bold" text-anchor="middle" x="862.0" y="216">② 登记进③</text><polyline fill="none" marker-end="url(#p)" points="880.0,202 880.0,290 220,290 220,340" stroke="#db2777" stroke-dasharray="6,5" stroke-width="2.4" /><circle cx="220" cy="318" fill="#db2777" r="17" stroke="#fff" stroke-width="2" /><text fill="#fff" font-family="PingFang SC, Heiti SC" font-size="18" font-weight="bold" text-anchor="middle" x="220" y="324">3</text><polyline fill="none" marker-end="url(#p)" points="360,390 420,390" stroke="#db2777" stroke-width="3.4" /><circle cx="390.0" cy="368" fill="#db2777" r="17" stroke="#fff" stroke-width="2" /><text fill="#fff" font-family="PingFang SC, Heiti SC" font-size="18" font-weight="bold" text-anchor="middle" x="390.0" y="374">4</text><polyline fill="none" marker-end="url(#b)" points="880.0,194 880.0,340" stroke="#d97706" stroke-width="3.4" /><circle cx="880.0" cy="280" fill="#d97706" r="17" stroke="#fff" stroke-width="2" /><text fill="#fff" font-family="PingFang SC, Heiti SC" font-size="18" font-weight="bold" text-anchor="middle" x="880.0" y="286">5</text><polyline fill="none" marker-end="url(#a)" points="260.0,192 260.0,550 885.0,550 885.0,510" stroke="#2563eb" stroke-width="3.4" /><circle cx="260.0" cy="562" fill="#2563eb" r="17" stroke="#fff" stroke-width="2" /><text fill="#fff" font-family="PingFang SC, Heiti SC" font-size="18" font-weight="bold" text-anchor="middle" x="260.0" y="568">6</text><rect fill="#fffbeb" height="214" rx="14" stroke="#fbbf24" stroke-width="2" width="1060" x="40" y="782" /><text fill="#92400e" font-family="PingFang SC, Heiti SC" font-size="15" font-weight="bold" text-anchor="middle" x="570.0" y="818">①~⑥ 主流程说明（状态流转，不含具体类/方法）</text><text fill="#111827" font-family="PingFang SC, Heiti SC" font-size="15" font-weight="bold" text-anchor="end" x="96" y="856">①</text><text fill="#44403c" font-family="PingFang SC, Heiti SC" font-size="13.5" text-anchor="start" x="112" y="856">A 先到达三级缓存：实例化完（仍未注入/未初始化）→ 登记进③最外层工厂（A 工厂）</text><text fill="#111827" font-family="PingFang SC, Heiti SC" font-size="15" font-weight="bold" text-anchor="end" x="96" y="887">②</text><text fill="#44403c" font-family="PingFang SC, Heiti SC" font-size="13.5" text-anchor="start" x="112" y="887">A 填充属性需 B → B 也被创建，登记进③（B 工厂）</text><text fill="#111827" font-family="PingFang SC, Heiti SC" font-size="15" font-weight="bold" text-anchor="end" x="96" y="918">③④</text><text fill="#44403c" font-family="PingFang SC, Heiti SC" font-size="13.5" text-anchor="start" x="112" y="918">B 填充属性需 A → 查缓存 ①② 均无 → 命中③ 的 A 工厂 → 产出 A 的早期引用 → 暂存②</text><text fill="#111827" font-family="PingFang SC, Heiti SC" font-size="15" font-weight="bold" text-anchor="end" x="96" y="949">⑤</text><text fill="#44403c" font-family="PingFang SC, Heiti SC" font-size="13.5" text-anchor="start" x="112" y="949">A 早期引用注入 B → B 完整 → B 升为成品入①</text><text fill="#111827" font-family="PingFang SC, Heiti SC" font-size="15" font-weight="bold" text-anchor="end" x="96" y="980">⑥</text><text fill="#44403c" font-family="PingFang SC, Heiti SC" font-size="13.5" text-anchor="start" x="112" y="980">回 A：注入完整的 B → A 完整 → A 也升为成品入①（此时 A 内仍是同一实例，只是补全了属性）</text></svg>