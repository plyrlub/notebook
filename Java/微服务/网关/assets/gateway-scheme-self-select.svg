<svg viewBox="0 0 680 616" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>终端路由过滤器scheme自选择机制</title>
  <desc>展示终端路由过滤器整组按URI scheme自选择执行：全局注册、按需生效</desc>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .ts{font:12px/1.4 var(--font-sans, sans-serif);fill:#5F5E5A}
    .th{font:500 14px/1.4 var(--font-sans, sans-serif);fill:#444441}
    .sl{font:500 13px var(--font-mono, monospace);fill:#378ADD}
  </style>

  <rect x="0" y="0" width="680" height="616" fill="#FFFFFF"/>

  <!-- request -->
  <g>
    <rect x="200" y="20" width="280" height="38" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
    <text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">请求 uri: lb://order-service</text>
  </g>
  <path d="M340 58 L340 76" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- user chain -->
  <rect x="40" y="80" width="600" height="64" rx="12" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="sl" x="56" y="102" dominant-baseline="central">用户过滤器链（order 已排序，全部执行完毕）</text>
  <text class="ts" x="56" y="126" dominant-baseline="central">AuthFilter → CircuitBreaker → RateLimiter → …</text>

  <path d="M340 144 L340 162" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- terminal routing filters -->
  <rect x="40" y="166" width="600" height="290" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="sl" x="56" y="188" dominant-baseline="central" fill="#0F6E56">终端路由过滤器（全部是 GlobalFilter，order 最大，链尾必经）</text>
  <text class="ts" x="56" y="206" dominant-baseline="central">每个请求都会经过；是否做事由 URI scheme 运行时自选择</text>

  <!-- row 1: LB acting -->
  <g>
    <rect x="60" y="218" width="560" height="48" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
    <text class="th" x="76" y="236" dominant-baseline="central">ReactiveLoadBalancerClientFilter</text>
    <text class="ts" x="76" y="254" dominant-baseline="central" fill="#854F0B">scheme = lb:// ？  ✓ 命中：解析实例地址，URL 改写为 http://ip:port</text>
  </g>
  <path d="M340 266 L340 276" fill="none" stroke="#5DCAA5" stroke-width="1.2" marker-end="url(#arr3)"/>

  <!-- row 2: Websocket pass -->
  <g>
    <rect x="60" y="278" width="560" height="48" rx="8" fill="#fff" stroke="#5DCAA5" stroke-width="0.5"/>
    <text class="th" x="76" y="296" dominant-baseline="central">WebsocketRoutingFilter</text>
    <text class="ts" x="76" y="314" dominant-baseline="central">scheme = ws:// ？  ✗ 放行（chain.filter 直通）</text>
  </g>
  <path d="M340 326 L340 336" fill="none" stroke="#5DCAA5" stroke-width="1.2" marker-end="url(#arr3)"/>

  <!-- row 3: Netty acting -->
  <g>
    <rect x="60" y="338" width="560" height="48" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
    <text class="th" x="76" y="356" dominant-baseline="central">NettyRoutingFilter</text>
    <text class="ts" x="76" y="374" dominant-baseline="central" fill="#854F0B">scheme = http(s):// ？  ✓ 命中：Netty HttpClient 转发，最终发出</text>
  </g>
  <path d="M340 386 L340 396" fill="none" stroke="#5DCAA5" stroke-width="1.2" marker-end="url(#arr3)"/>

  <!-- row 4: Forward pass -->
  <g>
    <rect x="60" y="398" width="560" height="48" rx="8" fill="#fff" stroke="#5DCAA5" stroke-width="0.5"/>
    <text class="th" x="76" y="416" dominant-baseline="central">ForwardRoutingFilter</text>
    <text class="ts" x="76" y="434" dominant-baseline="central">scheme = forward:// ？  ✗ 放行（isAlreadyRouted 直通）</text>
  </g>

  <path d="M340 456 L340 474" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- result -->
  <g>
    <rect x="170" y="478" width="340" height="34" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
    <text class="th" x="340" y="495" text-anchor="middle" dominant-baseline="central">下游服务实例（转发完成）</text>
  </g>

  <!-- key point -->
  <rect x="40" y="528" width="600" height="68" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="th" x="56" y="548" dominant-baseline="central">设计要点</text>
  <text class="ts" x="56" y="568" dominant-baseline="central">全局注册 ≠ 全局生效：生效范围由 URI scheme 运行时自选择。</text>
  <text class="ts" x="56" y="586" dominant-baseline="central">uri 声明一次，转发行为零配置自动派生。</text>
</svg>