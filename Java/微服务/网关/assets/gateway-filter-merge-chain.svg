<svg viewBox="0 0 680 460" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Gateway路由过滤器与全局过滤器合并执行模型</title>
  <desc>展示GatewayFilter与GlobalFilter合并进同一条有序链，及pre正序/post逆序的洋葱执行模型</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .ts{font:12px/1.4 var(--font-sans, sans-serif);fill:#5F5E5A}
    .th{font:500 14px/1.4 var(--font-sans, sans-serif);fill:#444441}
    .th2{font:500 13px/1.4 var(--font-sans, sans-serif);fill:#378ADD}
  </style>

  <rect x="0" y="0" width="680" height="460" fill="#FFFFFF"/>

  <!-- Stage label -->
  <text class="th2" x="40" y="28" dominant-baseline="central">合并：两个来源 → 一条有序链</text>

  <!-- Source 1: GatewayFilter -->
  <g>
    <rect x="40" y="44" width="260" height="80" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
    <text class="th" x="170" y="70" text-anchor="middle" dominant-baseline="central">GatewayFilter（路由过滤器）</text>
    <text class="ts" x="170" y="90" text-anchor="middle" dominant-baseline="central">配在 routes[].filters 或 default-filters</text>
    <text class="ts" x="170" y="108" text-anchor="middle" dominant-baseline="central">仅匹配的路由生效</text>
  </g>

  <!-- Source 2: GlobalFilter -->
  <g>
    <rect x="380" y="44" width="260" height="80" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
    <text class="th" x="510" y="70" text-anchor="middle" dominant-baseline="central">GlobalFilter（全局过滤器）</text>
    <text class="ts" x="510" y="90" text-anchor="middle" dominant-baseline="central">实现接口 + 注册为 Spring Bean</text>
    <text class="ts" x="510" y="108" text-anchor="middle" dominant-baseline="central">所有路由自动生效</text>
  </g>

  <!-- Merge arrows -->
  <path d="M170 126 Q170 150 290 168" fill="none" stroke="#378ADD" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M510 126 Q510 150 390 168" fill="none" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Merged chain box -->
  <rect x="120" y="150" width="440" height="44" rx="8" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
  <text class="th" x="340" y="172" text-anchor="middle" dominant-baseline="central">合并后统一按 order 排序</text>

  <!-- Sorted chain -->
  <path d="M340 194 L340 212" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Filter chain boxes -->
  <g>
    <rect x="60" y="214" width="120" height="44" rx="8" fill="#fff" stroke="#FAC775" stroke-width="0.5"/>
    <text class="th" x="120" y="231" text-anchor="middle" dominant-baseline="central">AuthFilter</text>
    <text class="ts" x="120" y="247" text-anchor="middle" dominant-baseline="central">order=-100</text>
  </g>
  <g>
    <rect x="200" y="214" width="120" height="44" rx="8" fill="#fff" stroke="#FAC775" stroke-width="0.5"/>
    <text class="th" x="260" y="231" text-anchor="middle" dominant-baseline="central">AddHeader</text>
    <text class="ts" x="260" y="247" text-anchor="middle" dominant-baseline="central">order=10</text>
  </g>
  <g>
    <rect x="340" y="214" width="120" height="44" rx="8" fill="#fff" stroke="#FAC775" stroke-width="0.5"/>
    <text class="th" x="400" y="231" text-anchor="middle" dominant-baseline="central">Retry</text>
    <text class="ts" x="400" y="247" text-anchor="middle" dominant-baseline="central">order=20</text>
  </g>
  <g>
    <rect x="480" y="214" width="120" height="44" rx="8" fill="#fff" stroke="#FAC775" stroke-width="0.5"/>
    <text class="th" x="540" y="231" text-anchor="middle" dominant-baseline="central">LogFilter</text>
    <text class="ts" x="540" y="247" text-anchor="middle" dominant-baseline="central">order=500</text>
  </g>

  <!-- Chain arrows -->
  <path d="M180 236 L196 236" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M320 236 L336 236" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M460 236 L476 236" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pre/Post model section -->
  <text class="th2" x="40" y="284" dominant-baseline="central">pre / post 执行模型（洋葱 / 俄罗斯套娃）</text>

  <!-- Onion layers -->
  <g>
    <rect x="80" y="300" width="520" height="60" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
    <text class="th" x="100" y="320" dominant-baseline="central">AuthFilter (order=-100)</text>
    <text class="ts" x="100" y="340" dominant-baseline="central">pre: 鉴权 →</text>
    <text class="ts" x="560" y="340" text-anchor="end" dominant-baseline="central">← post: 记录耗时</text>
  </g>
  <g>
    <rect x="130" y="310" width="420" height="40" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
    <text class="th" x="150" y="324" dominant-baseline="central">AddHeader (order=10)</text>
    <text class="ts" x="150" y="340" dominant-baseline="central">pre: 加头 →</text>
    <text class="ts" x="530" y="340" text-anchor="end" dominant-baseline="central">← post: 改响应头</text>
  </g>
  <g>
    <rect x="180" y="318" width="320" height="24" rx="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
    <text class="th" x="340" y="330" text-anchor="middle" dominant-baseline="central">chain.filter(exchange) → 转发下游</text>
  </g>

  <!-- Direction labels -->
  <text class="ts" x="340" y="386" text-anchor="middle" dominant-baseline="central" fill="#378ADD">pre 正序执行 ──────────────────→</text>
  <text class="ts" x="340" y="404" text-anchor="middle" dominant-baseline="central" fill="#993C1D">←────────────────── post 逆序执行</text>

  <!-- Key point -->
  <text class="ts" x="340" y="430" text-anchor="middle" dominant-baseline="central">order 最小 = 最外层：最先 pre，最后 post</text>
</svg>